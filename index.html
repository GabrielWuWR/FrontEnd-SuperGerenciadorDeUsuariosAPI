<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer type="module"></script>
    <title>Contatos</title>
</head>

<body>
    <header id="header" class="containerEstilo">
        <h1>Super Gerenciador de Usuários</h1>
    </header>

    <div class="containerCadastro">
        <h2>Cadastrar novo Usuário: </h2>

        <div class="formulario">
            <div class="inputs">
                <input id="inputNome" type="text" class="containerEstiloInput" placeholder="Nome">
                <input id="inputCelular" type="text" class="containerEstiloInput" placeholder="Celular">
                <input id="inputFoto" type="text" class="containerEstiloInput" placeholder="Foto">
                <input id="inputEmail" type="text" class="containerEstiloInput" placeholder="Email">
                <input id="inputEndereco" type="text" class="containerEstiloInput" placeholder="Endereço">
                <input id="inputCidade" type="text" class="containerEstiloInput" placeholder="Cidade">
            </div>

            <div id="cadastrar" class="containerEstilo botaoCadastro">
                <div class="containerBolhas">
                    <div class="bolha"></div>
                </div>
                Cadastrar
            </div>
        </div>
    </div>

    <div class="containerUsers" id="containerUsers">
        <div class="cabecalho containerEstilo">
            <p>Id</p>
            <p>Nome</p>
            <p>Imagem</p>
            <p>Ações</p>
        </div>
    </div>
</body>

</html>
